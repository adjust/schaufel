---
name: Build install package

on:
  release:
    types:
      - published

  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8

jobs:
  build-deb-gcc:
    name: Build (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        cc:
          - gcc
          # # Disable Clang (enable required: matrix.include.cc: clang)
          # - clang
        include:
          - cc: gcc
            LDFLAGS: ""
            CFLAGS: "-O2"
          # # Disable Clang (enable required: matrix.cc.clang)
          # - cc: clang
          #   # # Disable ASan, incompatible w/ Valgrind test
          #   # # https://github.com/google/sanitizers/issues/856#issuecomment-924966052
          #   # LDFLAGS: '-fsanitize=address -fno-omit-frame-pointer'
          #   # CFLAGS: '-Og -fsanitize=address -fno-omit-frame-pointer'
          #   LDFLAGS: ''
          #   CFLAGS: '-O2'
    env:
      CC: ${{ matrix.cc }}
      LDFLAGS: ${{ matrix.LDFLAGS }}
      CFLAGS: ${{ matrix.CFLAGS }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Fetch update package information
        run: sudo apt-get update --assume-yes

      - name: Install build-essential and tools
        run: sudo apt-get install --assume-yes build-essential debhelper dpkg-dev valgrind clang

      - name: Install package dependencies
        run: sudo apt-get install --assume-yes libconfig-dev libconfig++-dev libhiredis-dev libjson-c-dev libpq-dev librdkafka-dev

      - name: Run testsuite
        run: make test

      - name: Compile and build bianry
        run: make

      - name: Build package
        run: make package-deb

      - name: Upload package(s)
        uses: actions/upload-artifact@v4
        with:
          name: Packages-${{ matrix.os }}
          path: |
            schaufel_*.buildinfo
            schaufel_*.changes
            schaufel_*.deb
  release:
    needs: build-deb-gcc
    name: Debian-Package (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        cc:
          - gcc
          # # Disable Clang (enable required: matrix.include.cc: clang)
          # - clang
    env:
      CC: ${{ matrix.cc }}
      LDFLAGS: ${{ matrix.LDFLAGS }}
      CFLAGS: ${{ matrix.CFLAGS }}
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: Packages-${{ matrix.os }}

      - name: Release package(s)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            schaufel_*.buildinfo
            schaufel_*.changes
            schaufel_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-image:
    needs: build-deb-gcc
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      # only the upstream repository publishes, and only for a release:
      # workflow_dispatch and forks build without pushing
      PUBLISH: ${{ github.event_name == 'release' && github.repository == 'adjust/schaufel' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          version="$(sed -n 's/^SCHAUFEL_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile)"
          if [[ -z "${version}" ]]; then
              echo "could not read SCHAUFEL_VERSION from Makefile" >&2
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image version: ${version}"

      # the image must carry the same version as the deb packages, which take
      # it from SCHAUFEL_VERSION in the Makefile
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${RELEASE_TAG#v}" != "${PACKAGE_VERSION}" ]]; then
              echo "release tag '${RELEASE_TAG}' does not match SCHAUFEL_VERSION" \
                  "'${PACKAGE_VERSION}' in the Makefile" >&2
              exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # a single platform without attestations is pushed as a plain image
          # manifest, which every runtime can pull
          provenance: false
          sbom: false
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
